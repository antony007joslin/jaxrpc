# ================================================================
# EmployeeJaxRPC Build Properties
# ================================================================

# Project Information
project.name=EmployeeJaxRPC
project.version=1.0.0

# Java Compiler Settings
javac.source=1.8
javac.target=1.8
javac.debug=true
javac.encoding=UTF-8

# Package Base for Generated Code
package.base=com.example

# Directory Locations (relative to project root)
src.dir=src/main/java
resources.dir=src/main/resources
generated.dir=generated/java
lib.dir=lib
classes.dir=classes
dist.dir=dist
config.dir=config
wsdl.dir=WSDLs
xsd.dir=xsd

# WAR Configuration
war.name=EmployeeJaxRPC.war

# Application Server Settings (customize for your environment)
# WebSphere Application Server
was.home=C:/IBM/WebSphere/AppServer
was.profile=AppSrv01
was.cell=Cell01
was.node=Node01
was.server=server1

# Liberty Server
liberty.home=C:/IBM/wlp
liberty.server=defaultServer

# Deployment Directory (customize for your server)
deploy.dir=${was.home}/profiles/${was.profile}/installedApps/${was.cell}

# JAX-RPC/Axis Configuration
axis.home=${lib.dir}
axis.timeout=45000

# Logging Configuration
log.level=INFO
log.dir=logs

# SOAP Endpoint URLs (for testing)
employee.service.url=http://localhost:9080/EmployeeJaxRPC/services/EmployeeService
employee.query.url=http://localhost:9080/EmployeeJaxRPC/services/EmployeeQueryService
department.service.url=http://localhost:9080/EmployeeJaxRPC/services/DepartmentService
auth.service.url=http://localhost:9080/EmployeeJaxRPC/services/AuthService