# ================================================================
# Log4j Configuration for EmployeeJaxRPC
# ================================================================

# Root logger configuration
log4j.rootLogger=INFO, console, file

# ================================================================
# Console Appender Configuration
# ================================================================
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# ================================================================
# File Appender Configuration
# ================================================================
log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=${catalina.base}/logs/employee-jaxrpc.log
log4j.appender.file.MaxFileSize=10MB
log4j.appender.file.MaxBackupIndex=10
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p [%t] %c{1}:%L - %m%n

# ================================================================
# Package-level Logging Configuration
# ================================================================

# Application packages
log4j.logger.com.example.employee=DEBUG
log4j.logger.com.example.department=DEBUG
log4j.logger.com.example.auth=DEBUG
log4j.logger.com.example.common=INFO
log4j.logger.com.example.header=INFO

# Apache Axis logging
log4j.logger.org.apache.axis=INFO
log4j.logger.org.apache.axis.enterprise=WARN
log4j.logger.org.apache.axis.transport=INFO
log4j.logger.org.apache.axis.handlers=INFO

# SOAP message logging (set to DEBUG to see SOAP messages)
log4j.logger.org.apache.axis.SOAPPart=INFO
log4j.logger.org.apache.axis.Message=INFO

# HTTP transport logging
log4j.logger.httpclient.wire=WARN

# Spring Framework (if used)
log4j.logger.org.springframework=WARN

# Hibernate (if used)
log4j.logger.org.hibernate=WARN
log4j.logger.org.hibernate.SQL=DEBUG
log4j.logger.org.hibernate.type=TRACE

# ================================================================
# Performance Monitoring
# ================================================================
log4j.logger.performance=INFO, performance
log4j.additivity.performance=false

log4j.appender.performance=org.apache.log4j.RollingFileAppender
log4j.appender.performance.File=${catalina.base}/logs/performance.log
log4j.appender.performance.MaxFileSize=10MB
log4j.appender.performance.MaxBackupIndex=5
log4j.appender.performance.layout=org.apache.log4j.PatternLayout
log4j.appender.performance.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} - %m%n

# ================================================================
# Security Audit Logging
# ================================================================
log4j.logger.security=INFO, security
log4j.additivity.security=false

log4j.appender.security=org.apache.log4j.RollingFileAppender
log4j.appender.security.File=${catalina.base}/logs/security-audit.log
log4j.appender.security.MaxFileSize=10MB
log4j.appender.security.MaxBackupIndex=20
log4j.appender.security.layout=org.apache.log4j.PatternLayout
log4j.appender.security.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p - %m%n